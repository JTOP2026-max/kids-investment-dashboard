<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1266f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="投資小金庫"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>我的投資小金庫</title><style>
:root{--bg:#f7f9fc;--card:#fff;--text:#10213d;--muted:#6b7a90;--line:#e6ebf2;--blue:#1266f1;--blue2:#eff6ff;--up:#e02424;--down:#079447;--shadow:0 7px 22px rgba(22,47,84,.06)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff 0,#f7f9fc 260px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.wrap{max-width:1380px;margin:auto;padding:18px 22px 28px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.pig{font-size:42px}.brand h1{font-size:28px;margin:0;font-weight:900}.muted{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:10px}.btn{border:1px solid #dfe5ee;background:#fff;color:var(--text);padding:11px 18px;border-radius:11px;font-weight:800;cursor:pointer}.btn.primary{background:#1266f1;border-color:#1266f1;color:#fff}.live{text-align:right;font-size:13px;font-weight:800}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#13a857;margin:0 7px}.cards{display:grid;grid-template-columns:1.35fr .82fr .9fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.summary,.market-card,.today-card{padding:22px 25px}.label{font-size:14px;color:#52627a;font-weight:700}.big{font-size:38px;font-weight:900;margin:11px 0 19px}.stats3{display:grid;grid-template-columns:repeat(3,1fr)}.stat+.stat{padding-left:22px;border-left:1px solid var(--line)}.stat b{display:block;font-size:18px;margin-top:6px}.market-card .big{font-size:34px;margin-bottom:14px}.today-title{font-weight:900;font-size:16px;margin-bottom:13px}.today-row{display:flex;justify-content:space-between;padding:6px 0}.up{color:var(--up)!important}.down{color:var(--down)!important}.holdings{margin-top:15px;overflow:hidden}.section-head{display:flex;justify-content:space-between;padding:16px 20px 12px}.section-title{font-size:20px;font-weight:900}.table-wrap{overflow-x:auto;padding:0 14px 8px}table{width:100%;border-collapse:collapse;min-width:930px}th{background:#f8fafc;font-size:12px;padding:11px 12px;border-block:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}.stock{display:flex;align-items:center;gap:10px}.ticker{min-width:49px;height:40px;padding:0 8px;border-radius:10px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-weight:900}.stock-name{font-weight:900}.stock small,.price-time{display:block;color:var(--muted);font-size:11px;margin-top:3px}.price,.change{font-size:16px;font-weight:900}.subchange{display:block;font-size:11px}.pnl{font-weight:900}.return-pill{display:inline-block;padding:5px 11px;border-radius:8px;background:#fde9e9;color:var(--up);font-weight:900}.return-pill.down{background:#e7f7ee}.events{text-align:left!important;white-space:normal}.chip{display:inline-flex;padding:3px 6px;margin:2px;border-radius:6px;font-size:11px;font-weight:800;background:#eef4ff;color:#2865c7}.chip.today{background:#fff0ef;color:#b42318}.chip.soon{background:#fff6e8;color:#b54708}.chip.div{background:#fff4d7;color:#a15c00}.chip.cap{background:#eaf8ef;color:#087a3e}.reminder{margin-top:14px;background:#f0f7ff;border:1px solid #dbe9fa;border-radius:14px;padding:13px 19px;display:flex;gap:11px}.footer{text-align:center;color:#7b8798;font-size:11px;padding:14px}.install{display:none}.install.show{display:inline-block}dialog{border:0;border-radius:18px;padding:0;width:min(720px,calc(100% - 24px))}.modal{padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px}.field label{font-size:12px;color:var(--muted)}.note{font-size:12px;color:var(--muted)}.ok{color:#067647}.warn{color:#b54708}.edit-row{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:1px solid var(--line)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:900px){.top{grid-template-columns:1fr auto}.live{grid-column:1/-1;text-align:left}.cards{grid-template-columns:1fr 1fr}.today-card{grid-column:1/-1}}@media(max-width:620px){.wrap{padding:12px}.top{display:flex;flex-wrap:wrap}.brand{width:100%}.brand h1{font-size:23px}.pig{font-size:34px}.top-actions{width:100%}.top-actions .btn{flex:1}.live{width:100%;display:flex;justify-content:space-between}.cards{grid-template-columns:1fr}.summary,.market-card,.today-card{padding:17px}.big{font-size:31px}.stats3{gap:6px}.stat+.stat{padding-left:9px}.stat b{font-size:14px}.table-wrap{padding:0}.holdings table{min-width:760px}.form{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><div class="pig">🐷</div><div><h1>我的投資小金庫</h1><div class="muted">只看資產與學習投資，不提供下單功能</div></div></div><div class="top-actions"><button class="btn" id="editBtn">⚙ 管理持股</button><button class="btn primary" id="refreshBtn">↻ 立即更新</button><button class="btn install" id="installBtn">安裝 App</button></div><div class="live"><div><span id="status">準備更新</span><span class="dot"></span><span id="clock">--:--:--</span></div><div class="muted" id="countdown">每 10 秒自動更新</div></div></header><section class="cards"><div class="card summary"><div class="label">我的總資產</div><div class="big" id="totalValue">NT$ --</div><div class="stats3"><div class="stat"><span class="label">累計投入</span><b id="totalCost">--</b></div><div class="stat"><span class="label">總損益</span><b id="totalPnL">--</b></div><div class="stat"><span class="label">總報酬率</span><b id="totalReturn">--</b></div></div></div><div class="card market-card"><div class="label">台灣加權指數</div><div class="big" id="marketValue">--</div><b id="marketChange">--</b><div class="muted" id="vs" style="margin-top:15px">等待大盤資料</div></div><div class="card today-card"><div class="today-title">今日表現</div><div class="today-row"><span>今日資產變化</span><b id="dayPnL">--</b></div><div class="today-row"><span>今日報酬率</span><b id="dayReturn">--</b></div><div class="today-row"><span>持股檔數</span><b id="stockCount">--</b></div><div class="today-row"><span>現金股利（累計）</span><b id="cashDivTotal">NT$ 0</b></div></div></section><section class="card holdings"><div class="section-head"><div class="section-title">📊 我的持股</div></div><div class="table-wrap"><table><thead><tr><th>股票</th><th>目前價格</th><th>今日漲跌</th><th>市值</th><th>含權息損益</th><th>報酬率</th><th>重要事件</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="reminder">💡 <div><b>投資小提醒</b><div class="muted" id="lesson">分散投資、長期持有、持續學習。</div></div></div><div class="footer">資料來源：TWSE 台灣證券交易所｜僅供學習與紀錄，不提供投資建議或下單服務</div></div><dialog id="dlg"><div class="modal"><h2>管理持股</h2><div class="form"><div class="field"><label>股票代號</label><input id="code" list="codeList"><datalist id="codeList"></datalist></div><div class="field"><label>股票名稱</label><input id="name" list="nameList"><datalist id="nameList"></datalist></div><div class="field"><label>持有股數</label><input id="shares" type="number"></div><div class="field"><label>平均成本</label><input id="avg" type="number"></div><div class="field"><div id="match" class="note">輸入代號或名稱，系統會自動辨識。</div></div><div class="field"><button class="btn primary" id="add">新增持股</button></div></div><div id="portfolio"></div><div class="actions"><button class="btn" id="reset">恢復示範持股</button><button class="btn primary" id="done">完成</button></div></div></dialog><script>
const $=id=>document.getElementById(id),KEY='kidPortfolio',REF=10;let left=REF,dir={},events=[],actions=[],quotes={},market={price:0,prev:0},dataDate='',deferredPrompt=null;const demo=[{code:'0050',name:'元大台灣50',shares:1000,avgCost:52.3,exchange:'tse'},{code:'2330',name:'台積電',shares:100,avgCost:980,exchange:'tse'},{code:'2881',name:'富邦金',shares:500,avgCost:78.2,exchange:'tse'}];let holdings=(JSON.parse(localStorage.getItem(KEY)||'null')||demo).map(ensureHolding);const num=n=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2}),money=n=>'NT$ '+Math.round(n).toLocaleString('zh-TW'),pct=n=>(n>=0?'+':'')+n.toFixed(2)+'%',cls=n=>n>0?'up':n<0?'down':'';function todayTW(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function ensureHolding(h){if(h.originalShares==null)h.originalShares=+h.shares||0;if(h.originalAvgCost==null)h.originalAvgCost=+h.avgCost||0;if(!h.corpActionTrackingStart)h.corpActionTrackingStart='2026-08-18';return h}function actionStats(h){let shares=h.originalShares,cash=0,seen=new Set(),today=todayTW();for(const a of actions.filter(a=>String(a.code)===String(h.code)&&a.exDate>=h.corpActionTrackingStart&&a.exDate<=today)){if(seen.has(a.id))continue;seen.add(a.id);cash+=shares*(+a.cashDividend||0);shares+=shares*(+a.stockRatio||0)}let originalCost=h.originalShares*h.originalAvgCost,adjustedCost=Math.max(0,originalCost-cash);return{shares,cash,originalCost,adjustedCost}}function marketEx(m){return String(m).toUpperCase()==='TPEX'?'otc':'tse'}function byName(v){return Object.values(dir).find(x=>String(x.name).trim()===String(v).trim())}function sync(src){let x=src==='code'?dir[$('code').value.trim()]:byName($('name').value);if(x){$('code').value=x.code;$('name').value=x.name;$('match').textContent=`✓ ${x.code} ${x.name}`;$('match').className='note ok'}}async function loadDir(){let j=await(await fetch('https://jtop2026-max.github.io/taiwan-stock-dashboard/stocks.json?'+Date.now())).json();dir=j.stocks||{};let a=Object.values(dir);$('codeList').innerHTML=a.map(x=>`<option value="${x.code}">${x.name}</option>`).join('');$('nameList').innerHTML=a.map(x=>`<option value="${x.name}">${x.code}</option>`).join('')}async function loadEvents(){try{let ts=Date.now(),[e,a]=await Promise.all([fetch('https://jtop2026-max.github.io/taiwan-stock-dashboard/company_events.json?'+ts),fetch('https://jtop2026-max.github.io/taiwan-stock-dashboard/corporate_actions.json?'+ts)]);events=(await e.json()).events||[];actions=(await a.json()).actions||[];render()}catch{}}function dday(s){return Math.round((new Date(s+'T00:00:00+08:00')-new Date(todayTW()+'T00:00:00+08:00'))/86400000)}function ehtml(code){let es=events.filter(e=>String(e.code)===String(code)&&dday(e.date)>=-7).slice(0,3);if(!es.length)return'<span class="muted">—</span>';return es.map(e=>{let d=dday(e.date),c=d===0?'today':d>0&&d<=3?'soon':e.kind?.includes('dividend')?'div':e.kind?.includes('capital')?'cap':'';return `<span class="chip ${c}">${e.kind==='conference'?(d===0?'今日法說':d>0?d+'天後法說':'法說'):e.kind==='capital_increase'?'增資':e.kind==='capital_reduction'?'減資':e.kind?.includes('dividend')?'股利':e.title||'事件'}</span>`}).join('')}async function liveQuotes(){let ch=holdings.map(h=>`${h.exchange||'tse'}_${h.code}.tw`).concat('tse_t00.tw').join('|'),j=await(await fetch('/api/quotes?ch='+encodeURIComponent(ch),{cache:'no-store'})).json();if(!j.msgArray?.length)throw 0;let q={};for(const x of j.msgArray){let p=+String(x.z||'').replaceAll(',',''),pr=+String(x.y||'').replaceAll(',','');if(x.c==='t00'){if(p)market={price:p,prev:pr||p}}else if(x.c&&p)q[x.c]={price:p,prev:pr||p}}if(!Object.keys(q).length)throw 0;quotes=q}async function officialQuotes(){let j=await(await fetch('https://jtop2026-max.github.io/taiwan-stock-dashboard/stocks.json?'+Date.now())).json(),q={};for(const h of holdings){let x=j.stocks?.[h.code];if(x?.price)q[h.code]={price:+x.price,prev:+x.prevClose||+x.price}}quotes=q}async function refresh(){let live=true;try{await liveQuotes()}catch{live=false;await officialQuotes().catch(()=>{})}$('status').textContent=live?'盤中即時更新':'官方盤後資料';$('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false});left=REF;render()}function render(){let cost=0,val=0,base=0,cash=0,html='';for(const h of holdings){let s=actionStats(h),q=quotes[h.code]||{price:h.avgCost,prev:h.avgCost},v=s.shares*q.price,p=v-s.adjustedCost,r=s.adjustedCost?p/s.adjustedCost*100:0,ch=q.prev?(q.price-q.prev)/q.prev*100:0;cost+=s.originalCost;val+=v;base+=s.shares*q.prev;cash+=s.cash;html+=`<tr><td><div class="stock"><div class="ticker">${h.code}</div><div><div class="stock-name">${h.name}</div><small>${num(s.shares)} 股</small></div></div></td><td><span class="price">${num(q.price)}</span><span class="price-time">更新 ${$('clock').textContent}</span></td><td class="${cls(ch)}"><span class="change">${ch>=0?'▲':'▼'} ${pct(Math.abs(ch))}</span></td><td>${money(v)}</td><td class="pnl ${cls(p)}">${p>=0?'+':''}${money(p)}</td><td><span class="return-pill ${r<0?'down':''}">${pct(r)}</span></td><td class="events">${ehtml(h.code)}</td></tr>`}let pnl=val-(cost-cash),ret=(cost-cash)?pnl/(cost-cash)*100:0,dp=val-base,dr=base?dp/base*100:0,mr=market.prev?(market.price-market.prev)/market.prev*100:0;$('rows').innerHTML=html;$('totalValue').textContent=money(val);$('totalCost').textContent=money(cost);$('totalPnL').textContent=(pnl>=0?'+':'')+money(pnl);$('totalPnL').className=cls(pnl);$('totalReturn').textContent=pct(ret);$('totalReturn').className=cls(ret);$('dayPnL').textContent=(dp>=0?'+':'')+money(dp);$('dayPnL').className=cls(dp);$('dayReturn').textContent=pct(dr);$('dayReturn').className=cls(dr);$('stockCount').textContent=holdings.length+' 檔';$('cashDivTotal').textContent=money(cash);$('marketValue').textContent=market.price?num(market.price):'--';$('marketChange').textContent=market.price?pct(mr):'--';$('marketChange').className=cls(mr);$('vs').textContent=market.price?(dr>=mr?'🏆 今天跑贏大盤 '+(dr-mr).toFixed(2)+'%':'今天落後大盤 '+(mr-dr).toFixed(2)+'%'):'等待大盤資料'}function renderEditor(){$('portfolio').innerHTML=holdings.map((h,i)=>`<div class="edit-row"><b>${h.code} ${h.name}</b><button class="btn" data-del="${i}">刪除</button></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{holdings.splice(+b.dataset.del,1);localStorage.setItem(KEY,JSON.stringify(holdings));renderEditor();refresh()})}$('editBtn').onclick=()=>{renderEditor();$('dlg').showModal()};$('done').onclick=()=>$('dlg').close();$('refreshBtn').onclick=refresh;$('code').oninput=()=>sync('code');$('name').oninput=()=>sync('name');$('add').onclick=()=>{let x=dir[$('code').value.trim()]||byName($('name').value),shares=+$('shares').value,avgCost=+$('avg').value;if(!x||shares<=0||avgCost<=0)return alert('請確認股票、股數與平均成本');holdings.push(ensureHolding({code:x.code,name:x.name,shares,avgCost,exchange:marketEx(x.market),originalShares:shares,originalAvgCost:avgCost,corpActionTrackingStart:todayTW()}));localStorage.setItem(KEY,JSON.stringify(holdings));renderEditor();refresh()};$('reset').onclick=()=>{holdings=demo.map(ensureHolding);localStorage.setItem(KEY,JSON.stringify(holdings));renderEditor();refresh()};setInterval(()=>{left--;if(left<=0)refresh();$('countdown').textContent=`每 10 秒自動更新・${Math.max(left,0)} 秒`},1000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').classList.add('show')});$('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').classList.remove('show')}};render();loadDir().catch(()=>{});loadEvents();refresh();setInterval(loadEvents,1800000);
</script></body></html>
